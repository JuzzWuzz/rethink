name: Publish Washer pilot image

on:
    push:
        branches:
            - 'pilot/washer/**'

permissions:
    contents: read

concurrency:
    group: publish-washer-pilot
    cancel-in-progress: false

jobs:
    publish:
        if: ${{ github.repository == 'JuzzWuzz/rethink' }}
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 25
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/juzzwuzz/rethink
        steps:
            - name: Validate the pilot tag
              run: |
                  if [[ ! "$GITHUB_REF_NAME" =~ ^pilot/washer/(0\.1\.4-washer\.[1-9][0-9]*)$ ]]; then
                      echo "Use a versioned Washer pilot branch such as pilot/washer/0.1.4-washer.1."
                      exit 1
                  fi
                  printf 'PILOT_TAG=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Verify the selected source revision
              run: |
                  npm ci
                  npm exec prettier -- . --check --ignore-path .gitignore
                  npm run check
                  npm run build
                  npm test

            - name: Stage only Git-tracked source as the Docker context
              run: |
                  mkdir "$RUNNER_TEMP/washer-context"
                  git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/washer-context"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Guard against accidental reuse of a pilot tag
              run: |
                  if result=$(docker buildx imagetools inspect "$IMAGE:$PILOT_TAG" 2>&1); then
                      echo "The pilot tag already exists. Choose a new tag rather than overwriting it."
                      exit 1
                  fi
                  case "$result" in
                      *"not found"*|*"manifest unknown"*) ;;
                      *) printf '%s\n' "$result" >&2; exit 1 ;;
                  esac

            - name: Build and publish Linux ARM64
              id: image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ runner.temp }}/washer-context
                  platforms: linux/arm64
                  push: true
                  tags: ${{ env.IMAGE }}:${{ env.PILOT_TAG }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/JuzzWuzz/rethink
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: GIT_REVISION=${{ github.sha }}

            - name: Report the pinned image and architecture
              env:
                  DIGEST: ${{ steps.image.outputs.digest }}
              run: |
                  docker buildx imagetools inspect "$IMAGE@$DIGEST"
                  printf '### Washer pilot\n\n`%s:%s@%s`\n' "$IMAGE" "$PILOT_TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
